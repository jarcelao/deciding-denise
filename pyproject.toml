[project]
name = "deciding-denise"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jericho Arcelao", email = "jerichoarcelao@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
deciding-denise = "deciding_denise:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
